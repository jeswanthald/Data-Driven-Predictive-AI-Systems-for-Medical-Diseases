{% extends "base.html" %}

{% block content %}
<!-- Navigation -->
<div class="navbar navbar-fixed-top navbar-default" role="navigation">
    <div class="container">
        <div class="navbar-header">
            <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                <span class="icon icon-bar"></span>
                <span class="icon icon-bar"></span>
                <span class="icon icon-bar"></span>
            </button>
            <a href="/" class="navbar-brand">
                <img src="{{ url_for('static', filename='images/logo.png') }}" class="img-responsive" alt="logo">
            </a>
        </div>
        <div class="collapse navbar-collapse">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="/" class="smoothScroll">HOME</a></li>
                <li><a href="{{ url_for('auth.login') }}" class="smoothScroll">LOGIN</a></li>
            </ul>
        </div>
    </div>
</div>
<!-- End Navigation -->

<!-- Sign Up Form -->
<section style="margin-top: 100px;">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
                <div style="background:#fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc;">
                    <h2 class="text-center">Create an Account</h2>

                    {% with messages = get_flashed_messages() %}
                        {% if messages %}
                            <div class="alert alert-warning text-center">
                                {% for message in messages %}
                                    {{ message }}
                                {% endfor %}
                            </div>
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.signup') }}">
                        <div class="form-group">
                            <label for="name">Full Name</label>
                            <input type="text" class="form-control" name="name" placeholder="Your name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email address</label>
                            <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                        </div>

                        <div class="form-group">
                            <label for="password1">Password</label>
                            <input type="password" class="form-control" name="password1" placeholder="Password" required>
                        </div>

                        <div class="form-group">
                            <label for="password2">Confirm Password</label>
                            <input type="password" class="form-control" name="password2" placeholder="Confirm Password" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                    </form>

                    <p class="text-center" style="margin-top: 15px;">
                        Already have an account? <a href="{{ url_for('auth.login') }}">Log in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
