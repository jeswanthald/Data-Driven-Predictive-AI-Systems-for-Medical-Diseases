{% extends "disease_page.html" %}

{% block page %}
<br>
<br>
<br>
<div class="container">
  {% if msg %}
  <div class="alert alert-warning alert-dismissible">
    <a href="#" class="close" data-dismiss="alert" aria-label="close">&times;</a>
    <strong>Warning!</strong> {{ msg }}
  </div>
  {% endif %}

  <h1 style="text-align: center; padding-top: 50px;">Vitamin Deficiency Detection</h1>
  <div class="imageCoose" style="margin: auto; width: 50%; padding: 50px; background-color: rgba(0,0,0,0.6); color: white;">
    <h2>Select Image</h2>
    <form action="{{ url_for('vitamin.image') }}" method="POST">
      <input type="file" name="filename" required>
      <br><br>
      <input type="submit" value="Analyse">
    </form>
  </div>
</div>
{% endblock %}
