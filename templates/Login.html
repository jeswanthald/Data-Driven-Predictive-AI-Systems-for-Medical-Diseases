{% extends "base.html" %}

{% block content %}
<!-- start navigation -->
<div class="navbar navbar-fixed-top navbar-default" role="navigation">
    <div class="container">
        <div class="navbar-header">
            <button class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                <span class="icon icon-bar"></span>
                <span class="icon icon-bar"></span>
                <span class="icon icon-bar"></span>
            </button>
            <a href="/" class="navbar-brand">
                <img src="./static/images/logo.png" class="img-responsive" alt="logo">
            </a>
        </div>
        <div class="collapse navbar-collapse">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="/" class="smoothScroll">HOME</a></li>
                <li><a href="/signup" class="smoothScroll">SIGNUP</a></li>
            </ul>
        </div>
    </div>
</div>
<!-- end navigation -->

<!-- Login Form Section -->
<section style="margin-top: 100px;">
    <div class="container">
        <div class="row">
            <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2">
                <div style="background:#fff; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px #ccc;">
                    <h2 class="text-center">Login</h2>

                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <div class="alert alert-warning text-center">
                          {% for message in messages %}
                            {{ message }}
                          {% endfor %}
                        </div>
                      {% endif %}
                    {% endwith %}

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" class="form-control" name="email" placeholder="Enter email" required>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Password" required>
                        </div>

                        <button type="submit" class="btn btn-success btn-block">Log In</button>
                    </form>

                    <p class="text-center" style="margin-top: 15px;">
                        Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
